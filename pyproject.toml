[project]
name = "quill-new"
version = "0.1.0"
description = "Quill document import + task orchestration layer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "markitdown>=0.1.5",
    "openai>=1.40",
    "pydantic>=2.0",
    "json-repair>=0.42",
    "sentence-transformers>=3.0",
    "torch>=2.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "networkx>=3.3",
    "questionary>=2.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
scrapegraph = ["scrapegraphai>=1.0"]

# torch is only used for CPU sentence embeddings - avoid the ~1.5GB of bundled
# CUDA/nvidia libraries by pulling the CPU-only wheels from the PyTorch index.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
