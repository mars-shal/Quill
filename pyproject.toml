[project]
name = "quill-engine"
version = "0.1.0"
description = "OpenCode-style AI report engine: ingest a document, research it, and rewrite every section with any LLM provider."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.52.0",
    "sentence-transformers>=5.6.1",
    "tiktoken>=0.8.0",
    "python-docx>=1.1.2",
    "fpdf2>=2.8.0",
    "markitdown[docx,pdf,pptx]>=0.1.7,<0.2.0",
    "ddgs>=9.0.0",
    "opensearch-py>=2.4.0",
    "redis>=5.0.0",
    "questionary>=2.1.1",
    "textual>=4.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "scrapegraphai>=2.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quill_engine"]

[project.scripts]
quill = "quill_engine.cli:main"
quill-tui = "quill_engine.tui:run_tui"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
