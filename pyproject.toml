[project]
name = "quill-new"
version = "0.1.0"
description = "Quill document import + task orchestration layer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "markitdown[pdf]>=0.1.5",
    "openai>=1.40",
    "pydantic>=2.0",
    "json-repair>=0.42",
    "fastembed>=0.9.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "networkx>=3.3",
    "questionary>=2.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
scrapegraph = ["scrapegraphai>=1.0"]
# The evaluation harness uses an ONNX detector and a Hugging Face tokenizer;
# torch is not required for inference.
eval = ["transformers>=4.49", "onnxruntime>=1.18", "huggingface-hub>=0.24"]
