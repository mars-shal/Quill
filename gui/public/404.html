<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F9F9F9">
    <title>404 — Quill</title>
    <style>
      :root { color-scheme: light; --ink: #0F0F0F; --paper: #F9F9F9; --muted: #A1A1AA; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--ink);
        background: radial-gradient(ellipse 60% 45% at 50% 20%, rgba(255,255,255,.85), transparent 70%), var(--paper);
        font-family: "Funnel Display", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(680px, 100%);
        padding: 62px 34px 54px;
        color: var(--paper);
        background: #1A1A1A;
        border: 1px solid rgba(249,249,249,.12);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0,0,0,.22);
        text-align: center;
      }
      .code {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 11px;
        color: #D4D4D8;
        background: rgba(249,249,249,.08);
        border: 1px solid rgba(249,249,249,.12);
        border-radius: 999px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: .08em;
      }
      h1 {
        max-width: 16ch;
        margin: 20px auto 10px;
        color: var(--paper);
        font-size: clamp(30px, 5vw, 44px);
        font-weight: 700;
        letter-spacing: -.04em;
        line-height: 1.06;
      }
      p { max-width: 38ch; margin: 0 auto 24px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 18px;
        color: var(--ink);
        background: var(--paper);
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #E5E5E5; }
    </style>
  </head>
  <body>
    <main>
      <span class="code">404</span>
      <h1>This page doesn’t exist.</h1>
      <p>You might have taken a wrong turn. The library is still right here.</p>
      <a href="/">Back to Quill</a>
    </main>
  </body>
</html>
