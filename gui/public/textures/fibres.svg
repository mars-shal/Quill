<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Long fibres, like the flecks in recycled paper. Turbululence displaced
       along one axis only, so they read as strands rather than as static. -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.42" numOctaves="3" seed="19" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
  </filter>
  <rect width="220" height="220" filter="url(#f)" opacity="0.06"/>
</svg>
