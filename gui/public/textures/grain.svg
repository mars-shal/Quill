<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Paper grain. The turbulence is monochrome and low-frequency: enough to
       break up a flat fill, not enough to read as noise behind 17px text. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="7" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#g)" opacity="0.055"/>
</svg>
