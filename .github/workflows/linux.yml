name: Quill Linux Build

permissions:
  # The release step needs more than the repo default (read-only) grants.
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up the Python pipeline
        working-directory: .
        run: |
          uv python install 3.14
          uv sync --frozen

      - name: Python review tests
        working-directory: .
        run: |
          uv run --frozen python tests/test_style.py
          uv run --frozen python tests/test_plagiarism.py

      # Tauri v2 links against webkit2gtk-4.1 and GTK at build time and the
      # runner image ships none of the -dev packages.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # The lockfile lives next to package.json, not at the repository
          # root; without this setup-node fails before anything runs.
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Clean slate (remove previous builds)
        run: |
          rm -rf dist
          rm -rf src-tauri/target
          rm -rf src-tauri/gen

      - name: Tauri Linux build
        run: npm run tauri:build

      # The artifacts a Tauri build actually produces: the raw binary plus the
      # deb/rpm/appimage bundles under target/release. (The old check tested a
      # literal `src-tauri/binaries/*` glob that could never be a directory.)
      - name: Verify build
        run: |
          shopt -s globstar nullglob
          bundles=(src-tauri/target/release/bundle/**/*.deb src-tauri/target/release/bundle/**/*.rpm src-tauri/target/release/bundle/**/*.AppImage)
          sidecars=(src-tauri/binaries/quill-sidecar-*)
          if [ ! -x src-tauri/target/release/quill ] || [ ${#bundles[@]} -eq 0 ] || [ ${#sidecars[@]} -eq 0 ]; then
            echo "❌ Linux build artefacts not found"
            find src-tauri/target/release -maxdepth 3 -type f 2>/dev/null | head -20 || true
            find src-tauri/binaries -maxdepth 1 -type f 2>/dev/null || true
            exit 1
          fi
          if ! dpkg-deb -c "${bundles[0]}" | grep -q 'usr/bin/quill-sidecar'; then
            echo "❌ the deb does not contain the pipeline sidecar"
            exit 1
          fi
          echo "✓ Linux build artefacts verified"
          ls -l src-tauri/target/release/quill "${bundles[@]}"

      # Releases are cut from pushes to main only -- a pull request must not
      # mint a tag, and two runs must not fight over the same tag name.
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-build-${{ github.run_number }}
          name: "Quill Linux Build #${{ github.run_number }}"
          files: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux build artefact
        uses: actions/upload-artifact@v4
        with:
          name: quill-linux-build
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/src-tauri/target/release/bundle/rpm/*.rpm
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/quill
            gui/dist/**
