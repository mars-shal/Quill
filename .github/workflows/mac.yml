name: Quill Mac Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean slate (remove previous builds)
        run: |
          rm -rf dist
          rm -rf src-tauri/target
          rm -rf src-tauri/gen

      - name: Tauri Mac build
        run: npm run tauri:build

      - name: Verify build
        run: |
          if [ ! -d "src-tauri/binaries/*-apple-darwin" ]; then
            echo "❌ Mac build artefacts not found"
            exit 1
          fi
          echo "✓ Mac build artefacts verified"

      - name: Onboarding sequence check
        run: |
          # Verify the onboarding card works fresh install
          if [ -f "src-tauri/binaries/*-apple-darwin/Quill.app/Contents/MacOS/quill" ]; then
            echo "✓ Binary exists, onboarding sequence ready"
          else
            echo "❌ Binary not found"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-build-${{ github.run_number }}
          name: "Quill macOS Build #${{ github.run_number }}"
          files: |
            src-tauri/binaries/*-apple-darwin/Quill.app
            dist/**
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac build artefact
        uses: actions/upload-artifact@v4
        with:
          name: quill-mac-build
          path: |
            src-tauri/binaries/*-apple-darwin/Quill.app
            dist/**