name: Quill Windows Build

permissions:
  # The release step needs more than the repo default (read-only) grants.
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./gui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # The lockfile lives next to package.json, not at the repository
          # root; without this setup-node fails before anything runs.
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # pwsh, not cmd: the previous version indented this block into invalid
      # YAML, so the whole workflow never parsed, and its verify steps used
      # `if not exist` cmd syntax that pwsh rejects.
      - name: Clean slate (remove previous builds)
        run: |
          Remove-Item -Recurse -Force dist, src-tauri/target, src-tauri/gen -ErrorAction SilentlyContinue

      - name: Tauri Windows build
        run: npm run tauri:build

      - name: Verify build
        run: |
          $bundles = Get-ChildItem -Recurse -File -Path src-tauri/target/release/bundle -Include *.msi,*.exe -ErrorAction SilentlyContinue
          if (-not (Test-Path src-tauri/target/release/quill.exe) -or -not $bundles) {
            Write-Host "❌ Windows build artefacts not found"
            Get-ChildItem -Recurse src-tauri/target/release -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { $_.FullName }
            exit 1
          }
          Write-Host "✓ Windows build artefacts verified"
          $bundles | ForEach-Object { $_.FullName }

      # Releases are cut from pushes to main only -- a pull request must not
      # mint a tag, and two runs must not fight over the same tag name.
      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: "Quill Windows Build #${{ github.run_number }}"
          files: |
            gui/src-tauri/target/release/bundle/**/*.msi
            gui/src-tauri/target/release/bundle/**/*.exe
            gui/dist/**
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build artefact
        uses: actions/upload-artifact@v4
        with:
          name: quill-windows-build
          path: |
            gui/src-tauri/target/release/bundle/**
            gui/dist/**
